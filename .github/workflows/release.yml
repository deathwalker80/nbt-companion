# Builds NBT-Companion.exe on Windows when a version tag (v1.2.3) is pushed and publishes the release with the notes
# of .github/release-notes/<tag>.md. The exe must carry the same version as the tag (checked before publishing).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet publish src/NbtCompanion/NbtCompanion.csproj -c Release -r win-x64 -o out

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = "out/NBT-Companion.exe"
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          if ("v$v" -ne $env:TAG) { throw "the exe is version $v, the tag is $($env:TAG)" }
          $notesFile = ".github/release-notes/$($env:TAG).md"
          if (-not (Test-Path $notesFile)) { throw "$notesFile missing" }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notes = (Get-Content $notesFile -Raw).TrimEnd() + "`n`nAsset: NBT-Companion.exe - SHA-256 $sha`n"
          Set-Content -Path notes.md -Value $notes -NoNewline -Encoding utf8
          gh release create $env:TAG $exe --title "NBT Companion $v" --notes-file notes.md --verify-tag
